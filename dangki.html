<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký - XT Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: Verdana, Geneva, Tahoma, sans-serif; }
    .register-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .btn-success { background-color: #198754; border: none; padding: 12px; border-radius: 10px; font-weight: bold; transition: 0.3s; }
    .btn-success:hover { background-color: #146c43; transform: translateY(-2px); }
    .form-control { border-radius: 8px; padding: 12px; border: 1px solid #dee2e6; background-color: #fbfbfc; }
    .input-group-text { background-color: #fbfbfc; border-right: none; color: #6c757d; }
    .form-control { border-left: none; }
    .bg-navy { background-color: #ffffff; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

  <header class="bg-navy py-3 mb-4 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="Trang_chủ.html" class="text-decoration-none text-dark">
        <img src="logo.png" alt="XT Store" style="max-height: 60px;">
      </a>
      <a href="Trang_chủ.html" class="btn btn-outline-dark rounded-pill px-4">
        <i class="bi bi-house-door"></i> Về trang chủ
      </a>
    </div>
  </header>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card register-card p-2">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <h2 class="fw-bold mt-2">Tạo tài khoản</h2>
              <p class="text-muted small">Trở thành thành viên của XT Store ngay hôm nay</p>
            </div>

            <form onsubmit="return registerUser(event)">
              <div class="mb-3">
                <label class="form-label fw-bold small">Họ và tên</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" id="fullname" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold small">Địa chỉ Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="email" class="form-control" placeholder="nguyenvana@gmail.com" required>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold small">Mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" id="password" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold small">Xác nhận mật khẩu</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                  <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu" required>
                </div>
              </div>

              <button type="submit" class="btn btn-success w-100 mb-3 shadow-sm">
                ĐĂNG KÝ THÀNH VIÊN
              </button>
            </form>

            <div class="text-center mt-3">
              <p class="text-muted small">Bạn đã có tài khoản?</p>
              <a href="taikhoan.html" class="text-primary fw-bold text-decoration-none">
                <i class="bi bi-box-arrow-in-right"></i> Đăng nhập tại đây
              </a>
            </div>
          </div>
        </div>
        
        <div class="text-center mt-4 text-muted small">
          Bằng cách đăng ký, bạn đồng ý với Điều khoản của XT Store.
        </div>
      </div>
    </div>
  </div>

  <script>
    function registerUser(event) {
      event.preventDefault();

      const fullname = document.getElementById("fullname").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password.length < 6) {
        alert("⚠️ Mật khẩu phải có ít nhất 6 ký tự!");
        return false;
      }

      if (password !== confirmPassword) {
        alert("⚠️ Mật khẩu xác nhận không khớp!");
        return false;
      }

      // Lưu thông tin vào localStorage
      const user = { fullname, email, password };
      localStorage.setItem("user", JSON.stringify(user));

      alert("🎉 Chúc mừng " + fullname + "! Bạn đã đăng ký thành công.");
      window.location.href = "taikhoan.html"; 
      return false;
    }
  </script>
</body>
</html>
