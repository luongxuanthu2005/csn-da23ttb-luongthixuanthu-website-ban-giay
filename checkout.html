<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh toán - XT Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --primary-color: #0d6efd; }
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
    .payment-methods .form-check {
      border: 1px solid #dee2e6;
      padding: 15px 40px;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .payment-methods .form-check:hover { background-color: #f1f7ff; border-color: var(--primary-color); }
    .payment-methods .form-check-input:checked + .form-check-label { font-weight: bold; color: var(--primary-color); }
    .product-checkout-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
  </style>
</head>
<body>

<div class="container my-5">
  <div class="mb-4">
    <a href="giohang.html" class="text-decoration-none text-muted">
      <i class="bi bi-chevron-left"></i> Quay lại giỏ hàng
    </a>
  </div>

  <div class="row g-5">
    <div class="col-md-7">
      <h4 class="mb-4 fw-bold">Thông tin giao hàng</h4>
      <form id="checkout-form">
        <div class="card p-4 mb-4">
          <div class="mb-3">
            <label class="form-label fw-semibold">Họ và tên</label>
            <input type="text" class="form-control py-2" id="fullname" placeholder="Nhập đầy đủ họ tên" required>
          </div>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Số điện thoại</label>
              <input type="tel" class="form-control py-2" id="phone" placeholder="Ví dụ: 0344xxxxxx" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Email (Không bắt buộc)</label>
              <input type="email" class="form-control py-2" id="email" placeholder="email@example.com">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Địa chỉ nhận hàng</label>
            <textarea class="form-control py-2" id="address" rows="3" placeholder="Số nhà, tên đường, phường/xã, quận/huyện..." required></textarea>
          </div>
        </div>

        <h4 class="mb-4 fw-bold">Phương thức thanh toán</h4>
        <div class="card p-4 payment-methods">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" id="cod" value="Tiền mặt (COD)" checked>
            <label class="form-check-label d-flex align-items-center" for="cod">
              <i class="bi bi-truck me-3 fs-4 text-primary"></i> Thanh toán khi nhận hàng (COD)
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" id="momo" value="Ví MoMo">
            <label class="form-check-label d-flex align-items-center" for="momo">
              <i class="bi bi-wallet2 me-3 fs-4 text-danger"></i> Ví điện tử MoMo
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" id="bank" value="Chuyển khoản">
            <label class="form-check-label d-flex align-items-center" for="bank">
              <i class="bi bi-bank me-3 fs-4 text-success"></i> Chuyển khoản ngân hàng (QR Code)
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg mt-4 shadow-sm fw-bold py-3">
          XÁC NHẬN ĐẶT HÀNG
        </button>
      </form>
    </div>

    <div class="col-md-5">
      <div class="card sticky-top" style="top: 20px;">
        <div class="card-header bg-white py-3">
          <h5 class="mb-0 fw-bold">Đơn hàng của bạn</h5>
        </div>
        <div class="card-body">
          <div id="checkout-items" class="mb-3" style="max-height: 400px; overflow-y: auto;">
            </div>

          <hr>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Tạm tính</span>
            <span id="subtotal" class="fw-bold text-dark">0đ</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Phí vận chuyển</span>
            <span class="text-success fw-bold">Miễn phí</span>
          </div>
          <div class="d-flex justify-content-between mt-3">
            <span class="fs-5 fw-bold">Tổng cộng</span>
            <span id="checkout-total" class="fs-4 fw-bold text-danger">0đ</span>
          </div>
          
          <div class="mt-4 p-3 bg-light rounded text-muted" style="font-size: 0.85rem;">
            <i class="bi bi-shield-check me-2"></i> Thông tin cá nhân của bạn sẽ được bảo mật tuyệt đối theo chính sách của XT Store.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function formatCurrency(num) {
  return num.toLocaleString('vi-VN') + 'đ';
}

function renderCheckout() {
  // Lấy dữ liệu từ giỏ hàng chính thức thay vì checkoutCart để đảm bảo tính cập nhật
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let container = document.getElementById('checkout-items');
  let total = 0;
  container.innerHTML = "";

  if (cart.length === 0) {
    container.innerHTML = `<div class="text-center py-4">
      <i class="bi bi-cart-x fs-1 text-muted"></i>
      <p>Chưa có sản phẩm nào.</p>
    </div>`;
    return;
  }

  cart.forEach(item => {
    let sub = item.price * item.qty;
    total += sub;
    container.innerHTML += `
      <div class="d-flex align-items-center mb-3">
        <div class="position-relative">
          <img src="${item.image}" class="product-checkout-img border" alt="${item.name}">
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-secondary" style="font-size: 0.6rem;">
            ${item.qty}
          </span>
        </div>
        <div class="ms-3 flex-grow-1">
          <div class="fw-bold" style="font-size: 0.9rem;">${item.name}</div>
        </div>
        <div class="text-end fw-semibold">${formatCurrency(sub)}</div>
      </div>
    `;
  });

  document.getElementById('subtotal').textContent = formatCurrency(total);
  document.getElementById('checkout-total').textContent = formatCurrency(total);
}

function saveOrderHistory(paymentMethod, customerName) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  if (cart.length === 0) return;

  let history = JSON.parse(localStorage.getItem("orderHistory")) || [];

  let total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

  history.push({
    orderId: "DH" + Date.now(),
    date: new Date().toLocaleString("vi-VN"),
    customer: customerName,
    payment: paymentMethod,
    status: "Đã đặt",
    items: cart,
    total: total
  });

  localStorage.setItem("orderHistory", JSON.stringify(history));
}
// Xử lý khi nhấn nút Đặt hàng trong file checkout.html
document.getElementById('checkout-form').addEventListener('submit', function(e) {
  e.preventDefault(); // Ngăn trang web load lại theo kiểu mặc định
  
  // 1. Lấy dữ liệu (nếu cần gửi sang trang xác nhận)
  let name = document.getElementById('fullname').value;
  let payment = document.querySelector('input[name="payment"]:checked').value;
  
  // 2. Lưu thông tin tạm thời để trang xác nhận có thể hiển thị (Tùy chọn)
  const orderSummary = {
      customerName: name,
      paymentMethod: payment,
      orderDate: new Date().toLocaleDateString('vi-VN')
  };
  localStorage.setItem('lastOrder', JSON.stringify(orderSummary));

 // 3. LƯU LỊCH SỬ MUA HÀNG
saveOrderHistory(payment, name);

// 4. Xóa giỏ hàng sau khi đã lưu lịch sử
localStorage.removeItem("cart");

// 5. Chuyển sang trang đặt hàng thành công
window.location.href = "order_success.html";

});

// Khởi chạy
renderCheckout();
</script>

</body>
</html>
