<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết đơn hàng - XT Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .product-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="container my-5">

  <!-- Tiêu đề -->
  <div class="mb-4">
    <h3 class="fw-bold">
      <i class="bi bi-file-earmark-text me-2 text-primary"></i>
      Chi tiết đơn hàng
    </h3>
  </div>

  <!-- Thông tin đơn -->
  <div id="orderInfo" class="card shadow-sm mb-4"></div>

  <!-- Danh sách sản phẩm -->
  <div class="card shadow-sm">
    <div class="card-header bg-white fw-bold">
      Danh sách sản phẩm
    </div>
    <div class="card-body" id="productList"></div>
  </div>

  <!-- Nút quay lại -->
  <div class="mt-4">
    <a href="lichsu.html" class="btn btn-secondary">
      <i class="bi bi-arrow-left"></i> Quay lại lịch sử mua hàng
    </a>
  </div>

</div>

<script>
const order = JSON.parse(localStorage.getItem("orderDetail"));
const orderInfo = document.getElementById("orderInfo");
const productList = document.getElementById("productList");

// Nếu không có dữ liệu đơn hàng
if (!order) {
  orderInfo.innerHTML = `
    <div class="card-body text-center text-muted">
      <i class="bi bi-exclamation-circle fs-1"></i>
      <p class="mt-3">Không tìm thấy thông tin đơn hàng.</p>
    </div>
  `;
} else {

  // Thông tin chung
  orderInfo.innerHTML = `
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <p><strong>Mã đơn:</strong> ${order.orderId}</p>
          <p><strong>Khách hàng:</strong> ${order.customer}</p>
          <p><strong>Ngày đặt:</strong> ${order.date}</p>
        </div>
        <div class="col-md-6">
          <p><strong>Thanh toán:</strong> ${order.payment}</p>
          <p><strong>Trạng thái:</strong>
            <span class="badge bg-success">${order.status}</span>
          </p>
          <p><strong>Tổng tiền:</strong>
            <span class="text-danger fw-bold">
              ${order.total.toLocaleString("vi-VN")}đ
            </span>
          </p>
        </div>
      </div>
    </div>
  `;

  // Danh sách sản phẩm
  order.items.forEach(item => {
    productList.innerHTML += `
      <div class="d-flex align-items-center justify-content-between border-bottom py-3">
        <div class="d-flex align-items-center">
          <img src="${item.image}" class="product-img me-3" alt="${item.name}">
          <div>
            <div class="fw-semibold">${item.name}</div>
            <small class="text-muted">Số lượng: ${item.qty}</small>
          </div>
        </div>
        <div class="fw-bold">
          ${(item.price * item.qty).toLocaleString("vi-VN")}đ
        </div>
      </div>
    `;
  });
}
</script>

</body>
</html>
