<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Lịch sử mua hàng - XT Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .order-card:hover {
      transform: translateY(-2px);
      transition: 0.2s;
    }
  </style>
</head>

<body>

<div class="container my-5">

  <!-- Tiêu đề -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">
      <i class="bi bi-receipt-cutoff me-2 text-primary"></i>
      Lịch sử mua hàng
    </h3>

    <button class="btn btn-outline-danger btn-sm" onclick="clearHistory()">
      <i class="bi bi-trash me-1"></i> Xóa lịch sử
    </button>
  </div>

  <!-- Danh sách đơn -->
  <div id="orderList"></div>

  <!-- Quay lại -->
  <div class="mt-4">
    <a href="Trang_chủ.html" class="btn btn-secondary">
      <i class="bi bi-arrow-left"></i> Quay lại trang chủ
    </a>
  </div>

</div>

<script>
const orderList = document.getElementById("orderList");
let orders = JSON.parse(localStorage.getItem("orderHistory")) || [];

// Không có đơn hàng
if (orders.length === 0) {
  orderList.innerHTML = `
    <div class="text-center py-5 text-muted">
      <i class="bi bi-cart-x fs-1"></i>
      <p class="mt-3">Bạn chưa có đơn hàng nào.</p>
    </div>
  `;
}

// Hiển thị đơn hàng (mới nhất lên trước)
orders.reverse().forEach((order, index) => {
  orderList.innerHTML += `
    <div class="card mb-3 shadow-sm order-card">
      <div class="card-body">
        <div class="d-flex justify-content-between">
          <h5 class="fw-bold">Mã đơn: ${order.orderId}</h5>
          <span class="badge bg-success">${order.status}</span>
        </div>

        <p class="mb-1"><strong>Khách hàng:</strong> ${order.customer}</p>
        <p class="mb-1"><strong>Ngày đặt:</strong> ${order.date}</p>
        <p class="mb-1"><strong>Thanh toán:</strong> ${order.payment}</p>
        <p class="mb-2">
          <strong>Tổng tiền:</strong>
          <span class="text-danger fw-bold">
            ${order.total.toLocaleString("vi-VN")}đ
          </span>
        </p>

        <button class="btn btn-sm btn-outline-primary"
          onclick="viewDetail(${orders.length - 1 - index})">
          <i class="bi bi-eye"></i> Xem chi tiết
        </button>
      </div>
    </div>
  `;
});

// Xem chi tiết đơn
function viewDetail(index) {
  localStorage.setItem("orderDetail", JSON.stringify(orders[index]));
  window.location.href = "order_detail.html";
}

// Xóa lịch sử
function clearHistory() {
  if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử mua hàng?")) {
    localStorage.removeItem("orderHistory");
    location.reload();
  }
}
</script>

</body>
</html>
