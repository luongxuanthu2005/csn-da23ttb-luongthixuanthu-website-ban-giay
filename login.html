<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Admin - XT Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; font-family: 'Quicksand', sans-serif; }
    .login-box { max-width: 400px; margin: 100px auto; }
  </style>
</head>
<body>
  <div class="login-box card shadow-sm border-0">
    <div class="card-body">
      <h3 class="text-center mb-4">Đăng nhập Admin</h3>
      <div class="mb-3">
        <label class="form-label">Tên đăng nhập</label>
        <input type="text" id="username" class="form-control" placeholder="admin">
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="password" class="form-control" placeholder="123456">
      </div>
      <button class="btn btn-primary w-100" onclick="login()">Đăng nhập</button>
      <div id="errorMsg" class="text-danger mt-3 text-center"></div>
    </div>
  </div>

<script>
  function login() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;

    if (user === "admin" && pass === "123456") {
      localStorage.setItem("isAdminLoggedIn", "true");
      window.location.href = "admin.html";
    } else {
      document.getElementById('errorMsg').innerText = "Sai tên đăng nhập hoặc mật khẩu!";
    }
  }
</script>
</body>
</html>
