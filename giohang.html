<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - XT Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css.css">
  <style>
    .product-img { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
    .quantity-input { width: 70px; text-align: center; }
    .cart-item { transition: all 0.3s ease; }
    .cart-item:hover { background-color: #f8f9fa; }
    .empty-cart-img { max-width: 250px; opacity: 0.6; }
  </style>
</head>
<body style="background-color: rgb(242, 236, 241);">

<header class="bg-white shadow-sm py-2">
  <div class="container-fluid d-flex align-items-center justify-content-between px-4">
    <a href="Trang_chủ.html" class="text-decoration-none">
      <img src="logo.png" alt="XT Store" style="max-height: 60px;">
    </a>

    <form class="d-flex flex-grow-1 mx-5" style="max-width:600px; position:relative;">
      <div class="input-group">
        <input id="searchInput" class="form-control rounded-start-pill border-secondary-subtle ps-4" type="search" placeholder="Bạn đang tìm gì...">
        <button class="btn btn-dark rounded-end-pill px-4" type="submit">
          <i class="bi bi-search"></i>
        </button>
      </div>
      <div id="suggestions" class="list-group position-absolute w-100 mt-2 shadow-lg rounded-3" style="z-index:1050; top: 100%;"></div>
    </form>

    <div class="d-flex align-items-center">
      <div class="me-4">
        <a href="taikhoan.html" class="text-dark text-decoration-none">
          <i class="bi bi-person fs-4 me-1"></i> Tài khoản
        </a>
      </div>
      <div class="d-flex align-items-center text-dark bg-light px-3 py-1 rounded-pill border">
        <i class="bi bi-telephone-outbound-fill me-2 text-success"></i>
        <div style="line-height: 1.2;">
          <small class="text-muted d-block" style="font-size: 0.6rem;">HOTLINE</small>
          <strong style="font-size: 0.9rem;">0344.776.793</strong>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="container my-5">
  <div class="row">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-bold"><i class="bi bi-cart-check-fill text-primary"></i> GIỎ HÀNG CỦA BẠN</h5>
          <span id="cart-count-text" class="badge bg-secondary">0 sản phẩm</span>
        </div>
        <div class="card-body p-0">
          <div class="d-none d-md-flex bg-light p-3 fw-bold border-bottom text-secondary" style="font-size: 0.9rem;">
            <div style="width: 50%;">Sản phẩm</div>
            <div style="width: 20%;" class="text-center">Số lượng</div>
            <div style="width: 20%;" class="text-end">Thành tiền</div>
            <div style="width: 10%;"></div>
          </div>
          
          <div id="cart-list">
            </div>
        </div>
      </div>
      
      <div class="mt-3">
        <a href="Trang_chủ.html" class="text-decoration-none text-primary fw-bold">
          <i class="bi bi-arrow-left"></i> Tiếp tục mua sắm
        </a>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4">Chi tiết đơn hàng</h5>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Tạm tính:</span>
            <span id="subtotal" class="fw-bold">0đ</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Phí vận chuyển:</span>
            <span class="text-success fw-bold">Miễn phí</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4">
            <span class="fs-5 fw-bold">Tổng cộng:</span>
            <span id="total" class="fs-4 fw-bold text-danger">0đ</span>
          </div>
          <button class="btn btn-danger w-100 py-3 fw-bold rounded-3 shadow-sm" onclick="goToCheckout()">
            TIẾN HÀNH THANH TOÁN
          </button>
          <div class="text-center mt-3">
          <a href="lichsu.html" class="btn btn-outline-secondary w-100">
            <i class="bi bi-receipt"></i> Xem lịch sử mua hàng
          </a>
        </div>

          <div class="mt-4 p-3 bg-light rounded-3">
            <small class="text-muted d-block mb-2"><i class="bi bi-info-circle me-1"></i> Chính sách bán hàng:</small>
            <ul class="list-unstyled mb-0" style="font-size: 0.8rem;">
              <li>- Đổi trả trong 7 ngày nếu lỗi.</li>
              <li>- Kiểm tra hàng trước khi nhận.</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// Định dạng tiền VNĐ
function formatCurrency(num) {
  return num.toLocaleString('vi-VN') + 'đ';
}

// Lấy dữ liệu giỏ hàng
function getCart() {
  return JSON.parse(localStorage.getItem('cart')) || [];
}

// Lưu dữ liệu giỏ hàng
function saveCart(cart) {
  localStorage.setItem('cart', JSON.stringify(cart));
}

function renderCart() {
  let cart = getCart();
  let cartList = document.getElementById('cart-list');
  let countText = document.getElementById('cart-count-text');
  
  cartList.innerHTML = "";
  countText.textContent = cart.length + " sản phẩm";

  if (cart.length === 0) {
    cartList.innerHTML = `
      <div class="text-center py-5">
        <img src="https://cdn-icons-png.flaticon.com/512/2038/2038854.png" class="empty-cart-img mb-3">
        <p class="text-muted">Giỏ hàng của bạn đang trống.</p>
        <a href="Trang_chủ.html" class="btn btn-primary px-4">Mua sắm ngay</a>
      </div>
    `;
    updateSummary();
    return;
  }

  cart.forEach((item, index) => {
    let sub = item.price * item.qty;
    cartList.innerHTML += `
      <div class="cart-item d-flex align-items-center p-3 border-bottom flex-wrap flex-md-nowrap">
        <div class="d-flex align-items-center" style="width: 50%;">
          <img src="${item.image}" class="product-img me-3 border" alt="${item.name}">
          <div>
            <h6 class="mb-1 fw-bold text-dark">${item.name}</h6>
            <small class="text-muted d-block">Đơn giá: ${formatCurrency(item.price)}</small>
          </div>
        </div>
        <div style="width: 20%;" class="text-center">
          <div class="input-group input-group-sm justify-content-center">
             <button class="btn btn-outline-secondary" onclick="changeQty(${index}, -1)">-</button>
             <input type="text" value="${item.qty}" class="form-control text-center bg-white" readonly style="max-width: 40px;">
             <button class="btn btn-outline-secondary" onclick="changeQty(${index}, 1)">+</button>
          </div>
        </div>
        <div style="width: 20%;" class="text-end fw-bold text-danger">
          ${formatCurrency(sub)}
        </div>
        <div style="width: 10%;" class="text-end">
          <button class="btn btn-link text-danger" onclick="removeItem(${index})">
            <i class="bi bi-trash3 fs-5"></i>
          </button>
        </div>
      </div>
    `;
  });

  updateSummary();
}

// Thay đổi số lượng
function changeQty(index, delta) {
  let cart = getCart();
  cart[index].qty += delta;
  
  if (cart[index].qty < 1) cart[index].qty = 1;
  
  saveCart(cart);
  renderCart();
}

// Xóa sản phẩm
function removeItem(index) {
  if (confirm("Bạn có chắc chắn muốn xóa sản phẩm này?")) {
    let cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    renderCart();
  }
}

// Cập nhật tóm tắt tiền
function updateSummary() {
  let cart = getCart();
  let subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  
  document.getElementById('subtotal').textContent = formatCurrency(subtotal);
  document.getElementById('total').textContent = formatCurrency(subtotal);
}

function goToCheckout() {
  let cart = getCart();
  if (cart.length === 0) {
    alert("Giỏ hàng của bạn đang trống!");
    return;
  }
  window.location.href = "checkout.html";
}

// Khởi chạy
document.addEventListener('DOMContentLoaded', renderCart);
</script>

</body>
</html>
